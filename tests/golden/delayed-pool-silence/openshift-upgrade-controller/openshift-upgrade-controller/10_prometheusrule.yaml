apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    name: openshift-upgrade-controller
  name: openshift-upgrade-controller
  namespace: appuio-openshift-upgrade-controller
spec:
  groups:
    - name: drain.alerts
      rules:
        - alert: ClusterNotUpgradeable
          annotations:
            description: |
              The update channel of the cluster is set to minor version {{$labels.minor}},
              but the cluster cannot upgrade to the minor version of the channel.
              Check `oc adm upgrade` for more information.
            message: Cluster does not run minor version {{$labels.minor}} of its update
              channel.
            summary: Cluster is not upgradeable
          expr: |
            (
              count by (cluster_id, minor) (
                label_replace(cluster_version_available_updates, "minor", "$1", "channel", ".+-(.+)")
              )
              unless on (cluster_id, minor) (
                label_replace(cluster_version{type="current"}, "minor", "$1", "version", "^(\\d+\\.\\d+)\\..*")
              )
            )
            and on (cluster_id) (
              cluster_operator_conditions{name="version", condition="Upgradeable"} == 0
            )
          for: 15m
          labels:
            Maintenance: 'true'
            severity: warning
            syn: 'true'
            syn_component: openshift-upgrade-controller
        - alert: MaintenanceInProgress
          annotations:
            description: Cluster is currently upgrading
            message: An OpenShift upgrade is in progress on this cluster
            summary: Cluster is currently upgrading
          expr: |
            max(max_over_time(openshift_upgrade_controller_upgradejob_state{state="active"} [10m])) > 0
          for: 0m
          labels:
            Maintenance: 'true'
            severity: info
            syn: 'true'
            syn_component: openshift-upgrade-controller
        - alert: NodeDrainStuck
          annotations:
            description: Node {{$labels.node}} is draining for more than 10 minutes.
            message: Node {{$labels.node}} is draining for more than 10 minutes.
            runbook_url: https://hub.syn.tools/openshift-upgrade-controller/runbooks/NodeDrainStuck.html
            summary: Node is draining for more than 10 minutes.
          expr: |
            openshift_upgrade_controller_node_draining == 1
          for: 15m
          labels:
            Maintenance: 'true'
            severity: warning
            syn: 'true'
            syn_component: openshift-upgrade-controller
        - alert: PausedMachineConfigPool
          annotations:
            description: |
              MachineConfigPool {{$labels.pool}} is paused. A paused MachineConfigPool will likely block the next maintenance.
            message: MachineConfigPool {{$labels.pool}} is paused.
            runbook_url: https://hub.syn.tools/openshift-upgrade-controller/runbooks/PausedMachineConfigPool.html
            summary: Paused MachineConfigPool
          expr: |
            group(openshift_upgrade_controller_machine_config_pools_paused > 0) by (pool) unless on() group(openshift_upgrade_controller_upgradejob_state{state=~"active|paused"})
          for: 2h
          labels:
            severity: warning
            syn: 'true'
            syn_component: openshift-upgrade-controller
        - alert: UpgradeJobFailed
          annotations:
            description: |
              UpgradeJob {{$labels.upgradejob}} has failed with reason {{$labels.reason}}.

              Machine config pools might still try to apply changes if not paused.
              If the automatic pause on fail is enabled the next maintenance might be blocked.
              Check the runbook for instructions on how to clear the alert.
            message: UpgradeJob {{$labels.upgradejob}} has failed.
            runbook_url: https://hub.syn.tools/openshift-upgrade-controller/runbooks/UpgradeJobFailed.html
            summary: Failed UpgradeJob
          expr: |
            openshift_upgrade_controller_upgradejob_state{state="failed"}
            unless on(upgradejob)
            (label_replace(kube_configmap_info{namespace="appuio-openshift-upgrade-controller"}, "upgradejob", "$1", "configmap", "ack-(.*)"))
          for: 1m
          labels:
            severity: warning
            syn: 'true'
            syn_component: openshift-upgrade-controller
